<!DOCTYPE html>
<html>
<head>
  <title>IPO Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; color: #111; }
    h1 { margin-bottom: 4px; }
    .updated { color: #666; font-size: 13px; margin: 0 0 24px; }

    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 760px) { .columns { grid-template-columns: 1fr; } }

    .col-head { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
    .col-head span { color: #9ca3af; font-weight: 400; }

    .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .card.filed { border-left: 3px solid #2563eb; }
    .card.rumored { border-left: 3px solid #d97706; }
    .card.priced { border-left: 3px solid #16a34a; }
    .card.market { border-left: 3px solid #7c3aed; }

    .name { font-weight: 600; font-size: 16px; display: block; color: inherit; text-decoration: none; }
    a.name:hover { text-decoration: underline; color: #1e40af; }
    .chance { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #ede9fe; color: #5b21b6; }
    .signal { color: #444; font-size: 14px; margin-top: 5px; line-height: 1.45; }
    .stamp { color: #888; font-size: 12px; margin-top: 7px; }
    .empty { color: #9ca3af; font-size: 14px; font-style: italic; padding: 8px 0; }

    details { margin-top: 6px; }
    summary { cursor: pointer; font-size: 13px; color: #6b7280; padding: 6px 0; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary:hover { color: #111; }
    summary::before { content: '\25b8  '; }
    details[open] summary::before { content: '\25be  '; }

    .block { margin-top: 32px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
    .block summary { text-transform: uppercase; letter-spacing: 0.05em; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin-top: 14px; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>IPO Tracker</h1>
  <p class="updated" id="updated">Loading...</p>

  <div class="columns">
    <div>
      <div class="col-head">Filed <span id="filed-count"></span></div>
      <div id="filed"></div>
    </div>
    <div>
      <div class="col-head">Rumored <span id="rumored-count"></span></div>
      <div id="rumored"></div>
    </div>
  </div>

  <div class="block">
    <details open>
      <summary id="market-summary">Prediction markets</summary>
      <div class="grid2" id="markets"></div>
    </details>
  </div>

  <div class="block">
    <details>
      <summary id="priced-summary">Priced</summary>
      <div class="grid2" id="priced"></div>
    </details>
  </div>

  <script>
    const VISIBLE = 10;

    function isMarket(company) {
      return /kalshi/i.test(company.signal || '');
    }

    function fmtStamp(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      if (days <= 0) return date + ' \u00b7 today';
      if (days === 1) return date + ' \u00b7 yesterday';
      return date + ' \u00b7 ' + days + ' days ago';
    }

    function buildCard(company) {
      const market = isMarket(company);
      const card = document.createElement('div');
      card.className = 'card ' + (market ? 'market' : company.status);

      const title = company.source
        ? '<a class="name" href="' + company.source + '" target="_blank" rel="noopener">' + company.name + '</a>'
        : '<span class="name">' + company.name + '</span>';

      const chance = (market && company.confidence != null)
        ? '<span class="chance">' + company.confidence + '% chance</span>'
        : '';

      card.innerHTML = title
        + chance
        + '<div class="signal">' + (company.signal || '') + '</div>'
        + '<div class="stamp">' + fmtStamp(company.date) + '</div>';
      return card;
    }

    function renderColumn(list, containerId, countId, emptyText) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (countId) document.getElementById(countId).textContent = '(' + list.length + ')';

      if (list.length === 0) {
        container.innerHTML = '<div class="empty">' + emptyText + '</div>';
        return;
      }

      list.slice(0, VISIBLE).forEach(c => container.appendChild(buildCard(c)));

      const rest = list.slice(VISIBLE);
      if (rest.length > 0) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = 'Show ' + rest.length + ' more';
        details.appendChild(summary);
        const holder = document.createElement('div');
        rest.forEach(c => holder.appendChild(buildCard(c)));
        details.appendChild(holder);
        details.addEventListener('toggle', () => {
          summary.textContent = details.open ? 'Hide ' + rest.length : 'Show ' + rest.length + ' more';
        });
        container.appendChild(details);
      }
    }

    function renderFlat(list, containerId, emptyText) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">' + emptyText + '</div>';
        return;
      }
      list.forEach(c => container.appendChild(buildCard(c)));
    }

    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('updated').textContent =
          'Last updated ' + new Date(data.updated).toLocaleString();

        const all = (data.companies || []).slice();

        const markets = all.filter(isMarket)
          .sort((a, b) => (b.confidence || 0) - (a.confidence || 0));

        const rest = all.filter(c => !isMarket(c))
          .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        renderColumn(rest.filter(c => c.status === 'filed'), 'filed', 'filed-count', 'Nothing filed recently.');
        renderColumn(rest.filter(c => c.status === 'rumored'), 'rumored', 'rumored-count', 'No rumors tracked.');

        renderFlat(markets, 'markets', 'No active markets.');
        document.getElementById('market-summary').textContent =
          'Prediction markets \u2014 ' + markets.length + ' on Kalshi';

        const priced = rest.filter(c => c.status === 'priced');
        renderFlat(priced, 'priced', 'No priced deals.');
        document.getElementById('priced-summary').textContent =
          'Priced \u2014 ' + priced.length + ' deals';
      })
      .catch(error => {
        document.getElementById('updated').textContent = 'Could not load data.json';
      });
  </script>
</body>
</html>
